name: macOS build and release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build and verify ZIP
    runs-on: macos-26
    timeout-minutes: 25
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine release version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          source macOS/config/project.env
          tag="v$MARKETING_VERSION"
          if [[ ! "$MARKETING_VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::Expected a major.minor.patch version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "$tag" ]] || { echo "::error::Expected $tag"; exit 1; }
          elif [[ "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            previous=$(git show "$BEFORE:macOS/config/project.env" | sed -n 's/^MARKETING_VERSION="\([^"]*\)".*/\1/p')
            if [[ "$previous" == "$MARKETING_VERSION" ]]; then
              echo "Version unchanged. Build verification only."
              exit 0
            fi
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate city catalog
        run: python3 Shared/scripts/gen_cities.py

      - name: Build, sign, and verify package
        run: macOS/scripts/package.sh

      - name: Pass verified ZIP to release job
        if: steps.version.outputs.release_tag != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release
          path: macOS/build/release/Digital-World-Clock-Widgets.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    if: needs.build.outputs.release_tag != ''
    concurrency: release-${{ needs.build.outputs.release_tag }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-release

      - name: Publish verified ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets \
              --jq '(.isDraft == false) and any(.assets[]; .name == "Digital-World-Clock-Widgets.zip")' | grep -qx true; then
            echo "Release $TAG already has the ZIP."
            exit 0
          fi
          gh release create "$TAG" Digital-World-Clock-Widgets.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes \
            --title "Digital World-Clock Widgets $TAG"
